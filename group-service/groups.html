<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study Buddy — กลุ่มอ่านหนังสือ</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #192b25; background: #f3f7f3; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 560px); background: white; border: 1px solid #dce7df; border-radius: 20px; padding: 28px; box-shadow: 0 16px 48px #17392312; }
    h1 { margin-top: 0; font-size: 1.6rem; }
    h2 { font-size: 1.1rem; margin: 24px 0 0; }
    p { color: #52655a; line-height: 1.6; }
    label { display: block; margin: 16px 0 6px; font-weight: 650; }
    input, textarea, button, select { box-sizing: border-box; width: 100%; padding: 11px 12px; border: 1px solid #cbd9ce; border-radius: 10px; font: inherit; }
    input[type="checkbox"] { width: auto; }
    .check { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-weight: 650; }
    button { margin-top: 16px; background: #176b46; color: white; border: 0; font-weight: 700; cursor: pointer; }
    button.secondary { background: #e8f1eb; color: #176b46; }
    .row { display: flex; gap: 10px; }
    .row button { flex: 1; }
    ul { list-style: none; padding: 0; margin: 12px 0 0; }
    li { border: 1px solid #dce7df; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
    li button { width: auto; margin: 8px 8px 0 0; padding: 8px 12px; }
    #status { min-height: 1.5em; margin-bottom: 0; }
  </style>
</head>
<body>
  <main>
    <h1>กลุ่มอ่านหนังสือ</h1>
    <p>สร้าง ค้นหา ดูรายละเอียด และแก้ไขกลุ่มผ่าน Group API จริง</p>

    <label for="api">Group API URL</label>
    <input id="api" value="http://localhost:3003" autocomplete="url">
    <label for="token">Access token</label>
    <input id="token" type="password" autocomplete="off" placeholder="Bearer token จาก Auth Service">

    <h2>สร้างกลุ่ม</h2>
    <label for="subject">Subject (วิชา)</label>
    <input id="subject" placeholder="Calculus">
    <label for="topic">Topic (หัวข้อ)</label>
    <input id="topic" placeholder="Limits">
    <label for="datetime">Datetime (เวลา, ต้องเป็นอนาคต)</label>
    <input id="datetime" type="datetime-local">
    <label for="maxMembers">Max members (จำนวนสูงสุด)</label>
    <input id="maxMembers" type="number" min="1" step="1" value="5">
    <label for="location">Location (สถานที่)</label>
    <input id="location" placeholder="Library 3F">
    <label class="check" for="isOpen"><input id="isOpen" type="checkbox" checked> เปิดรับสมาชิก (isOpen)</label>
    <button id="create" type="button">สร้างกลุ่ม</button>

    <h2>ค้นหากลุ่ม</h2>
    <label for="searchSubject">Subject (ว่าง = ทุกกลุ่ม)</label>
    <input id="searchSubject" placeholder="Calculus">
    <label class="check" for="openOnly"><input id="openOnly" type="checkbox" checked> เฉพาะกลุ่มที่เปิดรับ (openOnly)</label>
    <div class="row">
      <button class="secondary" id="search" type="button">ค้นหา</button>
      <button class="secondary" id="listAll" type="button">แสดงทั้งหมด</button>
    </div>
    <ul id="groups"></ul>

    <h2>รายละเอียด / แก้ไข</h2>
    <label for="detailId">Group ID</label>
    <input id="detailId" placeholder="วาง id ที่ได้จากรายการ">
    <div class="row">
      <button class="secondary" id="detail" type="button">ดูรายละเอียด</button>
    </div>
    <label for="editTopic">Topic ใหม่ (เว้นว่าง = ไม่เปลี่ยน)</label>
    <input id="editTopic" placeholder="Derivatives">
    <label for="editLocation">Location ใหม่ (เว้นว่าง = ไม่เปลี่ยน)</label>
    <input id="editLocation" placeholder="Library 4F">
    <button class="secondary" id="patch" type="button">บันทึกการแก้ไข (PATCH)</button>

    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script>
    const api = document.querySelector('#api');
    const token = document.querySelector('#token');
    const subject = document.querySelector('#subject');
    const topic = document.querySelector('#topic');
    const datetime = document.querySelector('#datetime');
    const maxMembers = document.querySelector('#maxMembers');
    const location = document.querySelector('#location');
    const isOpen = document.querySelector('#isOpen');
    const searchSubject = document.querySelector('#searchSubject');
    const openOnly = document.querySelector('#openOnly');
    const groups = document.querySelector('#groups');
    const detailId = document.querySelector('#detailId');
    const editTopic = document.querySelector('#editTopic');
    const editLocation = document.querySelector('#editLocation');
    const status = document.querySelector('#status');

    const headers = () => ({ Authorization: `Bearer ${token.value.trim()}`, 'Content-Type': 'application/json' });
    async function request(path, options = {}) {
      const response = await fetch(`${api.value.replace(/\/$/, '')}${path}`, { ...options, headers: headers() });
      const body = await response.json();
      if (!response.ok) throw new Error(body.message || `Request failed (${response.status})`);
      return body;
    }

    const groupStatus = (g) => (!g.isOpen ? 'ปิดรับ' : g.members.length >= g.maxMembers ? 'เต็ม' : 'เปิดรับ');

    function renderList(items) {
      groups.innerHTML = '';
      for (const g of items) {
        const li = document.createElement('li');
        li.textContent = `${g.subject} • ${g.topic} • seats ${g.members.length}/${g.maxMembers} • ${groupStatus(g)}`;
        const view = document.createElement('button');
        view.type = 'button';
        view.className = 'secondary';
        view.textContent = 'ดูรายละเอียด';
        view.addEventListener('click', () => {
          detailId.value = g.id;
          showDetail(g.id);
        });
        li.appendChild(document.createElement('br'));
        li.appendChild(view);
        groups.appendChild(li);
      }
    }

    async function runSearch(onlyOpen) {
      const q = `subject=${encodeURIComponent(searchSubject.value.trim())}&openOnly=${onlyOpen ? 'true' : 'false'}`;
      const items = await request(`/api/groups?${q}`);
      renderList(items);
      status.textContent = items.length ? `พบ ${items.length} กลุ่ม` : 'ไม่พบกลุ่ม';
    }

    async function showDetail(id) {
      const g = await request(`/api/groups/${encodeURIComponent(id.trim())}`);
      status.textContent = `${g.subject} • ${g.topic} • ${g.datetime} • seats ${g.members.length}/${g.maxMembers} • ${groupStatus(g)} • ${g.location}`;
    }

    document.querySelector('#create').addEventListener('click', async () => {
      try {
        const body = {
          subject: subject.value.trim(),
          topic: topic.value.trim(),
          datetime: datetime.value ? new Date(datetime.value).toISOString() : '',
          maxMembers: Number(maxMembers.value),
          location: location.value.trim(),
          isOpen: isOpen.checked
        };
        const g = await request('/api/groups', { method: 'POST', body: JSON.stringify(body) });
        detailId.value = g.id;
        status.textContent = `สร้างกลุ่มแล้ว ${g.subject} • seats ${g.members.length}/${g.maxMembers}`;
      } catch (error) { status.textContent = error.message; }
    });

    document.querySelector('#search').addEventListener('click', async () => {
      try { await runSearch(openOnly.checked); }
      catch (error) { status.textContent = error.message; }
    });

    document.querySelector('#listAll').addEventListener('click', async () => {
      try {
        searchSubject.value = '';
        await runSearch(false);
      } catch (error) { status.textContent = error.message; }
    });

    document.querySelector('#detail').addEventListener('click', async () => {
      try { await showDetail(detailId.value); }
      catch (error) { status.textContent = error.message; }
    });

    document.querySelector('#patch').addEventListener('click', async () => {
      try {
        const body = {};
        if (editTopic.value.trim()) body.topic = editTopic.value.trim();
        if (editLocation.value.trim()) body.location = editLocation.value.trim();
        const g = await request(`/api/groups/${encodeURIComponent(detailId.value.trim())}`, {
          method: 'PATCH', body: JSON.stringify(body)
        });
        status.textContent = `แก้ไขแล้ว ${g.topic} • ${g.location}`;
      } catch (error) { status.textContent = error.message; }
    });
  </script>
</body>
</html>
