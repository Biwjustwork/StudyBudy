<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study Buddy — วิชาที่สนใจ</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #192b25; background: #f3f7f3; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 560px); background: white; border: 1px solid #dce7df; border-radius: 20px; padding: 28px; box-shadow: 0 16px 48px #17392312; }
    h1 { margin-top: 0; font-size: 1.6rem; }
    p { color: #52655a; line-height: 1.6; }
    label { display: block; margin: 16px 0 6px; font-weight: 650; }
    input, textarea, button { box-sizing: border-box; width: 100%; padding: 11px 12px; border: 1px solid #cbd9ce; border-radius: 10px; font: inherit; }
    textarea { min-height: 110px; resize: vertical; }
    button { margin-top: 16px; background: #176b46; color: white; border: 0; font-weight: 700; cursor: pointer; }
    button.secondary { background: #e8f1eb; color: #176b46; }
    .row { display: flex; gap: 10px; }
    .row button { flex: 1; }
    #status { min-height: 1.5em; margin-bottom: 0; }
  </style>
</head>
<body>
  <main>
    <h1>วิชาที่สนใจ</h1>
    <p>เข้าสู่ระบบก่อน แล้วเพิ่มชื่อวิชาที่อยากหาเพื่อนอ่าน คั่นแต่ละวิชาด้วยบรรทัดใหม่</p>
    <label for="api">Profile API URL</label>
    <input id="api" value="http://localhost:3002" autocomplete="url">
    <label for="token">Access token</label>
    <input id="token" type="password" autocomplete="off" placeholder="Bearer token จากหน้า Login">
    <label for="userId">User ID</label>
    <input id="userId" autocomplete="username" placeholder="ID ที่ได้จาก Auth Service">
    <div class="row">
      <button class="secondary" id="load" type="button">โหลดข้อมูล</button>
      <button class="secondary" id="search" type="button">ค้นหาวิชา</button>
    </div>
    <label for="subjects">วิชาที่สนใจ</label>
    <textarea id="subjects" placeholder="ชีววิทยา&#10;แคลคูลัส"></textarea>
    <button id="save" type="button">บันทึกวิชา</button>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script>
    const api = document.querySelector('#api');
    const token = document.querySelector('#token');
    const userId = document.querySelector('#userId');
    const subjects = document.querySelector('#subjects');
    const status = document.querySelector('#status');
    const headers = () => ({ Authorization: `Bearer ${token.value.trim()}`, 'Content-Type': 'application/json' });
    async function request(path, options = {}) {
      const response = await fetch(`${api.value.replace(/\/$/, '')}${path}`, { ...options, headers: headers() });
      const body = await response.json();
      if (!response.ok) throw new Error(body.message || `Request failed (${response.status})`);
      return body;
    }
    document.querySelector('#load').addEventListener('click', async () => {
      try {
        const profile = await request(`/api/users/${encodeURIComponent(userId.value.trim())}`);
        subjects.value = profile.subjects.join('\n');
        status.textContent = `โหลดข้อมูลของ ${profile.name} แล้ว`;
      } catch (error) { status.textContent = error.message; }
    });
    document.querySelector('#save').addEventListener('click', async () => {
      try {
        const profile = await request(`/api/users/${encodeURIComponent(userId.value.trim())}`, {
          method: 'PUT', body: JSON.stringify({ subjects: subjects.value.split('\n').map((item) => item.trim()).filter(Boolean) })
        });
        status.textContent = `บันทึกแล้ว ${profile.subjects.length} วิชา`;
      } catch (error) { status.textContent = error.message; }
    });
    document.querySelector('#search').addEventListener('click', async () => {
      const subject = window.prompt('พิมพ์ชื่อวิชาที่ต้องการค้นหา');
      if (!subject) return;
      try {
        const profiles = await request(`/api/users/search?subject=${encodeURIComponent(subject)}`);
        status.textContent = profiles.length ? `พบ ${profiles.length} คนที่สนใจ ${subject}: ${profiles.map((item) => item.name).join(', ')}` : `ยังไม่มีคนสนใจ ${subject}`;
      } catch (error) { status.textContent = error.message; }
    });
  </script>
</body>
</html>
