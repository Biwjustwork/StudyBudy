name: Auth Service CI

on:
  push:
    paths:
      - 'services/auth-service/**'
      - '.github/workflows/auth-service.yml'
  pull_request:
    paths:
      - 'services/auth-service/**'
      - '.github/workflows/auth-service.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth-service-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Syntax check, test, and Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/auth-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/auth-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find src tests -type f -name '*.js' -print0)

      - name: Run tests
        run: npm test

      - name: Build Docker image
        run: docker build --tag study-buddy-auth:ci .
