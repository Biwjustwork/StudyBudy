name: Auth Service CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'services/auth-service/**'
      - '.github/workflows/auth-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'services/auth-service/**'
      - '.github/workflows/auth-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-check:
    name: Test and build Auth Service
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/auth-service/package-lock.json

      - name: Install dependencies
        working-directory: services/auth-service
        run: npm ci

      - name: Run Auth Service tests
        working-directory: services/auth-service
        run: npm test

      - name: Build Auth Service image
        working-directory: services/auth-service
        run: docker build --tag study-buddy-auth-service:ci .
