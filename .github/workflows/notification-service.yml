name: Notification Service CI

on:
  push:
    paths:
      - 'notification-service/**'
      - '.github/workflows/notification-service.yml'
      - 'API_CONTRACT.md'
  pull_request:
    paths:
      - 'notification-service/**'
      - '.github/workflows/notification-service.yml'
      - 'API_CONTRACT.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notification-service-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, build, test, and Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: notification-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: notification-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript types including tests
        run: npm run typecheck

      - name: Build service
        run: npm run build

      - name: Run service tests
        run: npm test

      - name: Build Docker image
        run: docker build --tag study-buddy-notification:ci .
