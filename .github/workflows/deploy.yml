name: Deploy to Docker Hub

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag (e.g. v1.0.0, latest)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build & Push ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth-service
            context: ./services/auth-service
            image: study-buddy-auth
          - name: profile-service
            context: ./services/profile-service
            image: study-buddy-profile
          - name: group-service
            context: ./services/group-service
            image: study-buddy-group
          - name: membership-service
            context: ./services/membership-service
            image: study-buddy-membership
          - name: notification-service
            context: ./services/notification-service
            image: study-buddy-notification
          - name: frontend
            context: ./frontend
            image: study-buddy-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Docker Image Tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.0.0"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ steps.meta.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
